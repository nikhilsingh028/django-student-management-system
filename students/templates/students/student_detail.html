{% extends "students/base.html" %}

{% block title %}
Student Details
{% endblock %}


{% block content %}

<div class="card">

    <h1>Student Details</h1>

    <p>Name: {{ student.name }}</p>

    <p>Email: {{ student.email }}</p>

    <p>Age: {{ student.age }}</p>

    <p>Course: {{ student.course }}</p>

    <p>Created: {{ student.created_at }}</p>

    <a href="{% url 'student_list' %}">
        Back to Students
    </a>

</div>

{% endblock %}
