{% extends "students/base.html" %}

{% block title %}
Student Form
{% endblock %}


{% block content %}

<div class="card">

    {% if student %}
        <h1>Update Student</h1>
    {% else %}
        <h1>Add New Student</h1>
    {% endif %}

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Name:</label>

        <input
            type="text"
            name="name"
            value="{{ student.name|default:'' }}"
            required
        >

        <br><br>

        <label>Email:</label>

        <input
            type="email"
            name="email"
            value="{{ student.email|default:'' }}"
            required
        >

        <br><br>

        <label>Age:</label>

        <input
            type="number"
            name="age"
            value="{{ student.age|default:'' }}"
            min="0"
            required
        >

        <br><br>

        <label>Course:</label>

        <input
            type="text"
            name="course"
            value="{{ student.course|default:'' }}"
            required
        >

        <br><br>

        <button type="submit">
            Save Student
        </button>

    </form>

</div>

{% endblock %}
