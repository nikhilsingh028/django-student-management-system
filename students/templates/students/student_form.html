{% extends "students/base.html" %}

{% block title %}
{{ title }}
{% endblock %}


{% block content %}

<div class="card">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Student
        </button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back to Student List
    </a>

</div>

{% endblock %}
