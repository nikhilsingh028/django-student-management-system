{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Student Management System
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <h2>Student Management</h2>

        <div class="nav-links">

            <a href="{% url 'dashboard' %}">Dashboard</a>

            <a href="{% url 'student_list' %}">Students</a>

            <a href="{% url 'student_create' %}">Add Student</a>

            <a href="/admin/">Admin</a>

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer class="footer">

        <p>Student Management System | Built with Django</p>

    </footer>

</body>

</html>
