{% extends "students/base.html" %}

{% block title %}
Delete Student
{% endblock %}


{% block content %}

<div class="card">

    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Confirm Delete
        </button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Cancel
    </a>

</div>

{% endblock %}
