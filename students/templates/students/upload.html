<!DOCTYPE html>
<html>
<head>
    <title>Upload Student Files</title>
</head>

<body>

    <h1>Upload Student Files</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Upload Files
        </button>

    </form>

</body>
</html>
