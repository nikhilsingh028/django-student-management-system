{% extends "students/base.html" %}

{% block title %}
    Upload Profile
{% endblock %}

{% block content %}

<div class="card">

    <h1>Upload Student Profile</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <label>Student Name:</label>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <label>Profile Picture:</label>

        <input
            type="file"
            name="profile_picture"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Upload Profile
        </button>

    </form>

</div>

{% endblock %}
